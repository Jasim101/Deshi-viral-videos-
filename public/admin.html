<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন প্যানেল - ফান হাব</title>
<style>
:root{--bg:#0f1016;--card:#1a1b26;--line:#33354a;--text:#eceef8;--mute:#8f93ad;--ac:#ec2b8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif;padding-bottom:90px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.top b{font-size:18px;color:#fff}.top a,.top button{color:var(--mute);font-size:13px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;margin-left:8px;cursor:pointer}
.top a:hover,.top button:hover{color:#fff;border-color:var(--ac)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px}
#tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:18px;padding:8px 16px;font-family:inherit;cursor:pointer;font-size:14px;transition:0.2s}
#tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
#body{padding:0 14px;max-width:800px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.sub{border-left:3px solid var(--ac);padding-left:12px;margin-top:12px;background:#13141f;border-radius:0 10px 10px 0;padding:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button,.row2 button{background:#262838;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;margin-left:4px;cursor:pointer}
.bar .del,.del{color:#ff6b7a}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
input,select,textarea{display:block;width:100%;margin-top:5px;background:#0f1016;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=color]{height:44px;padding:4px;cursor:pointer}textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add{width:100%;margin-top:14px;padding:12px;border:1px dashed var(--ac);background:rgba(236,43,138,0.06);color:var(--ac);border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.add:hover{background:rgba(236,43,138,0.12)}
.up{display:inline-block;margin-top:8px;padding:8px 14px;background:#262838;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13px;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:10px;align-items:center}.row2 input{margin:0}
.mute{color:var(--mute);font-size:13px}
img.th{height:75px;border-radius:8px;margin-top:8px;display:block;object-fit:cover;border:1px solid var(--line)}
.save{position:fixed;left:0;right:0;bottom:0;padding:12px 18px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:90}
.save button{background:linear-gradient(90deg, #ec2b8a, #b02bec);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
#login{max-width:360px;margin:15vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:center}
#login button{width:100%;margin-top:16px;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="login" style="display:none">
  <div style="font-size:40px;margin-bottom:8px">🔐</div>
  <h2 style="margin:0 0 8px">অ্যাডমিন লগইন</h2>
  <p class="mute" style="margin-top:0">পাসওয়ার্ড দিয়ে প্যানেল অ্যাক্সেস করুন</p>
  <input id="pw" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড (admin123)" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">লগইন করুন</button>
  <p id="lerr" style="color:#ff6b7a;margin-top:10px;font-size:14px"></p>
</div>
<div id="app" style="display:none">
  <div class="top">
    <b>⚙ অ্যাডমিন কন্ট্রোল</b>
    <span>
      <a href="/" target="_blank">📱 অ্যাপ দেখুন</a>
      <a href="/api/download-project" download="fun-hub-full-source.zip">📥 ফুল কোড জিপ</a>
      <a href="/api/download-zip" download="fun-hub-standalone.zip">⚡ সার্ভার জিপ</a>
      <button onclick="logout()">লগআউট</button>
    </span>
  </div>
  <div id="tabs"></div>
  <div id="body"></div>
  <div class="save">
    <button onclick="save()">💾 সেভ করুন</button>
    <span id="st" class="mute"></span>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
